<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pharmacy SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            background: #2c3e50;
            min-height: 100vh;
            color: white;
        }
        .sidebar .nav-link {
            color: #bdc3c7;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 8px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: #34495e;
            color: white;
        }
        .main-content {
            background: #f8f9fa;
            min-height: 100vh;
        }
        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-action {
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 sidebar">
                <div class="d-flex flex-column p-3">
                    <h4 class="text-center mb-4">
                        <i class="bi bi-heart-pulse"></i> Pharmacy SaaS
                    </h4>
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a href="#" class="nav-link active" onclick="showDashboard()">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" onclick="showProducts()">
                                <i class="bi bi-box"></i> Products
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" onclick="showSales()">
                                <i class="bi bi-cart"></i> Sales
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" onclick="showCustomers()">
                                <i class="bi bi-people"></i> Customers
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" onclick="showInventory()">
                                <i class="bi bi-boxes"></i> Inventory
                            </a>
                        </li>
                    </ul>
                    <hr>
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2"></i>
                            <strong id="current-user">Admin</strong>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sign out</a></li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <!-- Dashboard Section -->
                <div id="dashboard-section">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Dashboard</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <div class="btn-group me-2">
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshDashboard()">
                                    <i class="bi bi-arrow-clockwise"></i> Refresh
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Stats Cards -->
                    <div class="row" id="stats-cards">
                        <!-- Stats will be loaded here -->
                    </div>

                    <!-- Recent Sales -->
                    <div class="table-container">
                        <h5>Recent Sales</h5>
                        <div id="recent-sales-table">
                            <!-- Recent sales will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Products Section -->
                <div id="products-section" style="display: none;">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Products</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <button type="button" class="btn btn-primary" onclick="showAddProductModal()">
                                <i class="bi bi-plus"></i> Add Product
                            </button>
                        </div>
                    </div>
                    <div class="table-container">
                        <div id="products-table">
                            <!-- Products will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Sales Section -->
                <div id="sales-section" style="display: none;">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Sales</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <button type="button" class="btn btn-primary" onclick="showAddSaleModal()">
                                <i class="bi bi-plus"></i> New Sale
                            </button>
                        </div>
                    </div>
                    <div class="table-container">
                        <div id="sales-table">
                            <!-- Sales will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Customers Section -->
                <div id="customers-section" style="display: none;">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Customers</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <button type="button" class="btn btn-primary" onclick="showAddCustomerModal()">
                                <i class="bi bi-plus"></i> Add Customer
                            </button>
                        </div>
                    </div>
                    <div class="table-container">
                        <div id="customers-table">
                            <!-- Customers will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Inventory Section -->
                <div id="inventory-section" style="display: none;">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Inventory</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <button type="button" class="btn btn-primary" onclick="showAddInventoryModal()">
                                <i class="bi bi-plus"></i> Add Stock
                            </button>
                        </div>
                    </div>
                    <div class="table-container">
                        <div id="inventory-table">
                            <!-- Inventory will be loaded here -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let currentUser = null;
        let authToken = null;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('authToken');
            if (token) {
                authToken = token;
                loadDashboard();
            } else {
                window.location.href = 'login.html';
            }
        });

        // Navigation functions
        function showDashboard() {
            hideAllSections();
            document.getElementById('dashboard-section').style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            event.target.classList.add('active');
            loadDashboard();
        }

        function showProducts() {
            hideAllSections();
            document.getElementById('products-section').style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            event.target.classList.add('active');
            loadProducts();
        }

        function showSales() {
            hideAllSections();
            document.getElementById('sales-section').style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            event.target.classList.add('active');
            loadSales();
        }

        function showCustomers() {
            hideAllSections();
            document.getElementById('customers-section').style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            event.target.classList.add('active');
            loadCustomers();
        }

        function showInventory() {
            hideAllSections();
            document.getElementById('inventory-section').style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            event.target.classList.add('active');
            loadInventory();
        }

        function hideAllSections() {
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('products-section').style.display = 'none';
            document.getElementById('sales-section').style.display = 'none';
            document.getElementById('customers-section').style.display = 'none';
            document.getElementById('inventory-section').style.display = 'none';
        }

        // API functions
        async function apiCall(endpoint, options = {}) {
            const url = endpoint.startsWith('http') ? endpoint : `/${endpoint}`;
            const config = {
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                ...options
            };
            
            try {
                const response = await fetch(url, config);
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    window.location.href = 'login.html';
                    return null;
                }
                return await response.json();
            } catch (error) {
                console.error('API call failed:', error);
                return null;
            }
        }

        // Load data functions
        async function loadDashboard() {
            const stats = await apiCall('api/dashboard/stats');
            if (stats) {
                displayStats(stats);
                loadRecentSales();
            }
        }

        function displayStats(stats) {
            const statsContainer = document.getElementById('stats-cards');
            statsContainer.innerHTML = `
                <div class="col-md-3">
                    <div class="stats-card text-center">
                        <i class="bi bi-box text-primary" style="font-size: 2rem;"></i>
                        <h3>${stats.total_products || 0}</h3>
                        <p class="text-muted">Total Products</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card text-center">
                        <i class="bi bi-people text-success" style="font-size: 2rem;"></i>
                        <h3>${stats.total_customers || 0}</h3>
                        <p class="text-muted">Total Customers</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card text-center">
                        <i class="bi bi-cart text-warning" style="font-size: 2rem;"></i>
                        <h3>${stats.total_sales || 0}</h3>
                        <p class="text-muted">Total Sales</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card text-center">
                        <i class="bi bi-currency-dollar text-info" style="font-size: 2rem;"></i>
                        <h3>$${stats.total_revenue || 0}</h3>
                        <p class="text-muted">Total Revenue</p>
                    </div>
                </div>
            `;
        }

        async function loadRecentSales() {
            const sales = await apiCall('api/sales?limit=5');
            if (sales && sales.data) {
                displayRecentSales(sales.data);
            }
        }

        function displayRecentSales(sales) {
            const container = document.getElementById('recent-sales-table');
            if (sales.length === 0) {
                container.innerHTML = '<p class="text-muted">No recent sales</p>';
                return;
            }

            let html = `
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sales.forEach(sale => {
                html += `
                    <tr>
                        <td>${new Date(sale.created_at).toLocaleDateString()}</td>
                        <td>${sale.customer_name || 'N/A'}</td>
                        <td>$${sale.total_amount || 0}</td>
                        <td><span class="badge bg-success">${sale.status || 'completed'}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-action" onclick="viewSale(${sale.id})">
                                <i class="bi bi-eye"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function loadProducts() {
            const products = await apiCall('api/products');
            if (products && products.data) {
                displayProducts(products.data);
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('products-table');
            if (products.length === 0) {
                container.innerHTML = '<p class="text-muted">No products found</p>';
                return;
            }

            let html = `
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            products.forEach(product => {
                html += `
                    <tr>
                        <td>${product.name}</td>
                        <td>${product.category_name || 'N/A'}</td>
                        <td>$${product.selling_price || 0}</td>
                        <td>${product.stock_quantity || 0}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-action" onclick="editProduct(${product.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteProduct(${product.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function loadSales() {
            const sales = await apiCall('api/sales');
            if (sales && sales.data) {
                displaySales(sales.data);
            }
        }

        function displaySales(sales) {
            const container = document.getElementById('sales-table');
            if (sales.length === 0) {
                container.innerHTML = '<p class="text-muted">No sales found</p>';
                return;
            }

            let html = `
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sales.forEach(sale => {
                html += `
                    <tr>
                        <td>${new Date(sale.created_at).toLocaleDateString()}</td>
                        <td>${sale.customer_name || 'N/A'}</td>
                        <td>$${sale.total_amount || 0}</td>
                        <td><span class="badge bg-success">${sale.status || 'completed'}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-action" onclick="viewSale(${sale.id})">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteSale(${sale.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function loadCustomers() {
            const customers = await apiCall('api/customers');
            if (customers && customers.data) {
                displayCustomers(customers.data);
            }
        }

        function displayCustomers(customers) {
            const container = document.getElementById('customers-table');
            if (customers.length === 0) {
                container.innerHTML = '<p class="text-muted">No customers found</p>';
                return;
            }

            let html = `
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Loyalty Points</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            customers.forEach(customer => {
                html += `
                    <tr>
                        <td>${customer.name}</td>
                        <td>${customer.email || 'N/A'}</td>
                        <td>${customer.phone || 'N/A'}</td>
                        <td>${customer.loyalty_points || 0}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-action" onclick="editCustomer(${customer.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-info btn-action" onclick="viewCustomerHistory(${customer.id})">
                                <i class="bi bi-clock-history"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function loadInventory() {
            const inventory = await apiCall('api/inventory');
            if (inventory && inventory.data) {
                displayInventory(inventory.data);
            }
        }

        function displayInventory(inventory) {
            const container = document.getElementById('inventory-table');
            if (inventory.length === 0) {
                container.innerHTML = '<p class="text-muted">No inventory items found</p>';
                return;
            }

            let html = `
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Branch</th>
                            <th>Quantity</th>
                            <th>Batch</th>
                            <th>Expiry</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            inventory.forEach(item => {
                const expiryDate = item.expiry_date ? new Date(item.expiry_date).toLocaleDateString() : 'N/A';
                const isExpiringSoon = item.expiry_date && new Date(item.expiry_date) <= new Date(Date.now() + 30 * 24 * 60 * 60 * 1000);
                
                html += `
                    <tr>
                        <td>${item.product_name || 'N/A'}</td>
                        <td>${item.branch_name || 'N/A'}</td>
                        <td>
                            <span class="badge ${item.quantity <= 10 ? 'bg-warning' : 'bg-success'}">
                                ${item.quantity}
                            </span>
                        </td>
                        <td>${item.batch_number || 'N/A'}</td>
                        <td>
                            <span class="${isExpiringSoon ? 'text-danger' : ''}">${expiryDate}</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-action" onclick="viewInventoryItem(${item.id})">
                                <i class="bi bi-eye"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Placeholder functions for CRUD operations
        function refreshDashboard() {
            loadDashboard();
        }

        function showAddProductModal() {
            alert('Add Product modal - To be implemented');
        }

        function showAddSaleModal() {
            alert('Add Sale modal - To be implemented');
        }

        function showAddCustomerModal() {
            alert('Add Customer modal - To be implemented');
        }

        function showAddInventoryModal() {
            alert('Add Inventory modal - To be implemented');
        }

        function editProduct(id) {
            alert(`Edit Product ${id} - To be implemented`);
        }

        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                alert(`Delete Product ${id} - To be implemented`);
            }
        }

        function viewSale(id) {
            alert(`View Sale ${id} - To be implemented`);
        }

        function deleteSale(id) {
            if (confirm('Are you sure you want to delete this sale?')) {
                alert(`Delete Sale ${id} - To be implemented`);
            }
        }

        function editCustomer(id) {
            alert(`Edit Customer ${id} - To be implemented`);
        }

        function viewCustomerHistory(id) {
            alert(`View Customer History ${id} - To be implemented`);
        }

        function viewInventoryItem(id) {
            alert(`View Inventory Item ${id} - To be implemented`);
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
